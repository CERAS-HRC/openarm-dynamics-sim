  - 23.000016
  kp_nm_rad: 120
  kd_nm_s_rad: 12
- name: j3_l3
  type: revolute
  motor: '06'
  limits_deg:
  - -134.500124
  - 134.500124
  kp_nm_rad: 120
  kd_nm_s_rad: 12
- name: j4_l4
  type: revolute
  motor: '06'
  limits_deg:
  - -134.999743
  - 134.999743
  kp_nm_rad: 120
  kd_nm_s_rad: 12
- name: j5_l5
