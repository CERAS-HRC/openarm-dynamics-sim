# dynamics_sim_arm (Onshape): J1/J2: 03, J3/J4: 06, J5/J6/J7: 00. Joint angles are degrees.
# The URDF, joint limits, 00-J6 ratings and linkages pins are written by scripts/prepare_dynamics_sim_arm.py.
# J6 is driven at the swivel (no moving lever); 00-J6 is the motor through the most favourable lever ratio, so it leans high.
# linkages: the swivel load is replaced by bearing + lever pin loads (see docs/MODEL.md).
# fea.exclude_bodies lists every motor EXCEPT rs00_2: the J6 motor, l5 and l5_2 are one rigid part named l5.
# collision.decompose_bodies: concave forearm parts collide as small convex cells instead of one filled hull.
# Tip is the drumstick's striking end. The floor height is assumed, not measured.
model_type: urdf
name: Dynamics sim arm / RobStride / J6 lever
urdf:
  path: dynamics_sim_arm.urdf
  package_roots: []
  tip_link: drumstick
  tip_offset_m:
  - 0.0
  - -0.15
  - 0.1631
base_xyz_m:
- 0.0
- 0.0
- 0.0
base_rpy_deg:
- 0.0
- 0.0
- 0.0
gravity_m_s2:
- 0.0
- 0.0
- -9.81
motors:
  '03':
    mass_kg: 0.88
    diameter_m: 0.106
    depth_m: 0.056
    rated_torque_nm: 20.0
    peak_torque_nm: 60.0
    rated_speed_rpm: 100.0
    no_load_speed_rpm: 195.0
    gear_ratio: 9.0
    source: https://robstride.com/products/robStride03
  '06':
    mass_kg: 0.621
    diameter_m: 0.088
    depth_m: 0.049
    rated_torque_nm: 11.0
    peak_torque_nm: 36.0
    rated_speed_rpm: 100.0
    no_load_speed_rpm: 480.0
    gear_ratio: 9.0
    source: https://robstride.com/products/robStride06
  '00':
    mass_kg: 0.31
    diameter_m: 0.057
    depth_m: 0.051
    rated_torque_nm: 5.0
    peak_torque_nm: 14.0
    rated_speed_rpm: 100.0
    no_load_speed_rpm: 315.0
    gear_ratio: 10.0
    source: https://robstride.com/products/robStride00
  00-J6:
    mass_kg: 0.31
    rated_torque_nm: 6.314
    peak_torque_nm: 21.287
    rated_speed_rpm: 79.19
    no_load_speed_rpm: 249.46
    gear_ratio: 10.0
    lever_ratio_range:
    - 1.2627
    - 1.5205
    source: 'RobStride 00 through the J6 lever: peak torque and speeds use the most
      favourable lever ratio'
